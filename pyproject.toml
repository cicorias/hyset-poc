[project]
name = "hyset"
version = "0.1.0"
description = "Clean-room PoC of HySet: set-level tool retrieval via query-conditioned hyperedge prediction (arXiv:2607.25718)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shawn Cicoria" }]
requires-python = ">=3.12"
keywords = ["llm", "agents", "tool-retrieval", "hypergraph", "mcp", "pytorch"]
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# LLM agent + judge for execution-feedback rewards (Claude via Anthropic, or local Ollama).
llm = ["langchain>=1.0", "langchain-anthropic>=1.0", "langchain-ollama>=1.0"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.6"]

[project.urls]
Repository = "https://github.com/cicorias/hyset-poc"
Paper = "https://arxiv.org/abs/2607.25718"

[project.scripts]
hyset = "hyset.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
default-groups = ["dev"]

# CPU-only torch wheels (no multi-GB CUDA download). Remove for a GPU box.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyset"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # typer uses call defaults

[tool.ruff.lint.per-file-ignores]
"src/hyset/datasets/synthetic.py" = ["E501"]  # catalog of long description strings
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads a model or runs long",
    "llm: calls a real LLM provider (costs money / needs a running server)",
]
addopts = "-m 'not slow and not llm'"
